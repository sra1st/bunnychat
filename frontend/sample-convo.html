<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sample bunnychat conversation, moonlit and cozy, showing how a chat looks in the garden.">
  <meta name="theme-color" content="#c97ee8">
  <title>sample convo 🥕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #c97ee8;
      --surface: rgba(84, 25, 120, 0.28);
      --surface-strong: rgba(255,255,255,0.14);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.72);
      --muted-strong: rgba(255,255,255,0.58);
      --shadow: rgba(44, 5, 72, 0.16);
      --radius: 22px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body { min-height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; line-height: 1.6; }

    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; color: rgba(255,255,255,0.95); animation: twinkle 2s infinite; }
    .back:focus-visible {
      outline: 2px solid rgba(255,255,255,0.9);
      outline-offset: 4px;
    }
    .back, .pill, .tag { transition: transform .23s ease, background .23s ease, border-color .23s ease; }
    .back:hover, .pill:hover, .tag:hover { transform: translateY(-1px); }
    .back:hover { background: rgba(255,255,255,0.18); }
    @media (prefers-reduced-motion: reduce) {
      .star, .back, .pill, .tag { transition: none; animation: none; }
    }
    @keyframes twinkle { 0%,100%{opacity:0.05;transform:scale(0.7)} 50%{opacity:1;transform:scale(1.6)} }

    #wrap {
      position: relative; z-index: 1;
      max-width: 760px; margin: 0 auto;
      padding: 28px 20px 56px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .back {
      font-size: 12px;
      color: rgba(255,255,255,0.72);
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .tag {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.58);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .hero {
      text-align: center;
      margin: 18px auto 26px;
      max-width: 620px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 48px);
      letter-spacing: 1px;
      font-weight: 800;
      text-shadow: 0 0 24px rgba(255,255,255,0.22);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: clamp(13px, 2.2vw, 16px);
      line-height: 1.7;
      color: rgba(255,255,255,0.76);
      max-width: 560px;
      margin: 0 auto;
    }

    .convo-card {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--radius);
      padding: 22px 18px;
      box-shadow: 0 14px 30px var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
    }

    .convo-card img {
      width: 100%;
      max-width: 480px;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 18px;
    }

    .pill {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
    }

    .footer-note {
      margin-top: 22px;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      #wrap { padding: 22px 16px 48px; }
      .convo-card { padding: 18px 12px; }
    }
  </style>
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <main id="wrap">
    <div class="topbar">
      <a class="back" href="/" aria-label="Back to the garden">← back to the garden</a>
      <div class="tag">sample convo</div>
    </div>

    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">✦ sample convo ✦</h1>
      <p class="subtitle">
        a peek at two bunnies sharing a carrot and a few secrets in the garden.
      </p>
    </section>

    <section class="convo-card" aria-label="Sample bunnychat conversation">
      <img src="convo-final.png" alt="A sample bunnychat conversation between two bunnies, in kaomoji faces, sharing a carrot and chatting.">
    </section>

    <div class="pill-row">
      <div class="pill">two bunnies, one carrot</div>
      <div class="pill">sharing is caring 🥕</div>
    </div>

    <footer class="footer-note">
      every garden has its own little stories ✦
    </footer>
  </main>

  <script>
    const starData = [
      [5,8],[12,22],[20,5],[28,40],[35,15],[42,60],[50,30],[58,10],[65,50],[72,25],
      [80,70],[88,35],[95,12],[8,55],[18,80],[30,65],[45,85],[60,75],[75,90],[90,55],
      [15,45],[25,20],[38,90],[55,5],[70,40],[85,20],[3,70],[22,35],[48,55],[78,15],
      [7,33],[17,67],[33,12],[47,77],[63,22],[77,58],[91,40],[4,90],[24,50],[53,38]
    ];
    const sc = document.getElementById('stars');
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < starData.length; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      s.textContent = i % 3 === 0 ? '✦' : i % 3 === 1 ? '·' : '✧';
      s.style.left = `${starData[i][0]}%`;
      s.style.top = `${starData[i][1]}%`;
      s.style.fontSize = `${7 + (i % 6)}px`;
      s.style.animationDelay = `${i * 0.12}s`;
      s.style.animationDuration = `${1.5 + (i % 3)}s`;
      fragment.appendChild(s);
    }
    sc.appendChild(fragment);
  </script>
</body>
</html>
